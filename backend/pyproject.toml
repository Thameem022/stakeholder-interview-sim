[project]
name = "stakeholder-interview-sim"
version = "1.0.0"
description = "AI-powered stakeholder interview simulator with real-time audio"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.2",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.4",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "numpy>=1.26.0",
    "pyjwt[crypto]>=2.10",
    "anthropic[bedrock]>=1.11.0",
    "boto3>=1.43.106",
    "aws-sdk-bedrock-runtime>=0.11.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "python-multipart>=0.0.32",
]
scripts = [
    "python-docx>=1.1.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]
# Dev-only analysis stack for backend/evals/. Not shipped: the wheel packages
# only ["app"], so nothing here reaches production.
evals = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pingouin>=0.5.4",
    "statsmodels>=0.14",
    "rapidfuzz>=3.6",
    "tqdm>=4.66",
    "pyarrow>=15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Deliberate: mimetypes and logging are configured before the app imports.
"app/main.py" = ["E402"]
"app/evaluation/iqr_scorer.py" = ["E501", "I001"]
"app/evaluation/iqr_schema.py" = ["E501", "I001"]
"app/evaluation/sic_scorer.py" = ["E501", "I001", "F841"]
"app/evaluation/multi_source_evaluator.py" = ["E501", "I001", "F401", "F841", "W293"]
"app/personas/prompt_assembly.py" = ["E501"]
"scripts/*.py" = ["E501", "I001", "F401", "F841", "W293", "W292"]
"evals/**/*.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "llm: calls Bedrock and costs money; skipped unless RUN_LLM_EVALS=1",
]

