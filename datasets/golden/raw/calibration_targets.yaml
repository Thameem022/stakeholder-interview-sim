# DERIVED calibration targets -- what the scores SHOULD have been, according to the grader's
# written memos. These are NOT observed scores. Nobody recorded these numbers; they are read
# out of the memo prose in docs/Trial Run/*/[June_8|June_15]_2026 SES Test Memo.docx.
#
# The observed scores live in diagnostic_scores.yaml and are not modified by this file.
# Use these as tuning targets, never as ground truth.
#
# basis tells you how much the number is worth:
#   memo_explicit    -- the memo states a number or a band for this interview. Trust it.
#   memo_directional -- the memo says which way to move but gives no magnitude. The DIRECTION
#                       is the grader's; the MAGNITUDE is interpolated and is the weakest part
#                       of this file. Treat as a starting point, not a target to fit exactly.
#   memo_endorsed    -- the memo affirms the score as-is. target == observed, deliberately.
#   no_guidance      -- the memo says nothing about this interview. target == observed.
#
# Only fields the memo actually speaks to are set. Absent field = no change from observed.

# ---------------------------------------------------------------------------------------
# June 6 set -- reviewed in "Review of Interview Simulation (Round 2)", June 8 2026.
# This is the round the memo makes concrete scoring claims about.
# ---------------------------------------------------------------------------------------

"2026-06-06_tom_good":
  basis: memo_explicit
  memo: "June_8_2026 SES Test Memo.docx -- A.1"
  quote: >-
    Tom's good interview remains the clearest mismatch: despite surfacing regulatory silence,
    incentive alignment, policy lag, path dependency, future obligations, capital-shaped
    priorities, and emergent system outcomes, the interview receives only an 8.2 IQR score,
    which appears lower than the process quality demonstrated in the transcript. [...] Refine
    the upper end of the IQR prompt so that interviews that surface full Tier 3 system logic
    are scored in the high-8 to low-9 range or above, rather than being held in the low-8s.
  target_overall: 8.8
  rationale: >-
    Observed 8.2. The memo names this interview specifically and gives an explicit band
    ("high-8 to low-9 range or above"). 8.8 sits in that band. This interview is also the only
    one in the corpus at 100% SIC on all three tiers, which is the condition the memo attaches
    the band to ("interviews that surface full Tier 3 system logic").

"2026-06-06_alex_good":
  basis: memo_directional
  memo: "June_8_2026 SES Test Memo.docx -- A.1"
  quote: >-
    The "good interviews" for Alex, Mike, and Sarah are scored reasonably well, but still
    somewhat conservatively.
  target_overall: 8.5
  rationale: >-
    Observed 8.2. Direction (up) is the grader's; magnitude is interpolated. Held to a modest
    +0.3 because the memo calls these "reasonably well" scored and reserves the real complaint
    for Tom. Alex's SIC is the weakest of the four good interviews (60/40/56), so this one is
    nudged least among the three.

