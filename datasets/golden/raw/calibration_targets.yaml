"2026-06-06_sarah_bad":
  basis: memo_directional
  memo: "June_8_2026 SES Test Memo.docx -- A.2"
  quote: >-
    in Sarah's bad interview, Tier 2 and Tier 3 appear to receive meaningful credit even though
    the deeper threshold and fragility content was mostly volunteered by Sarah and not really
    developed by the student. [...] Strengthen SIC logic so that Tier 2 and Tier 3 cue counts
    are discounted when the interviewer does not follow up on volunteered insight. Content
    appearing in the transcript should not, by itself, count as access.
  target_sic_t2_pct: 25
  target_sic_t2_found: 1
  target_sic_t3_pct: 0
  target_sic_t3_found: 0
  rationale: >-
    Observed T2 75% (3/4), T3 35% (2/4). The memo says the credit is wrong because the content
    was volunteered and undeveloped, and asks for those cues to be discounted. Applying that
    rule strictly drops T3 to zero (both its cues were indirect-credit on volunteered content)
    and leaves T2 with one cue. The direction and the reasoning are the grader's; the exact
    residual counts are interpolated -- confirming them needs a per-cue pass over the transcript,
    which this dataset deliberately does not carry.
  overall_unchanged_because: >-
    The memo faults the SIC credit here, not the IQR. Observed 4.5 stands.

"2026-06-06_mike_bad":
  basis: memo_directional
  memo: "June_8_2026 SES Test Memo.docx -- A.2"
  quote: >-
    in Mike's bad interview, Tier 1 is marked full largely because Mike volunteered strong
    baseline observations without much interviewer development.
  target_sic_t1_pct: 33.3
  target_sic_t1_found: 1
  target_sic_t1_status: partial
  rationale: >-
    Observed T1 100% (3/3, full) on an interview scored 3.0 overall. The memo names this as
    over-credit for volunteered content. Dropping to 1 of 3 removes the two cues the memo
    describes as undeveloped. Direction is the grader's; the residual count is interpolated.
  overall_unchanged_because: >-
    The memo faults the SIC credit here, not the IQR. Observed 3.0 stands.

"2026-06-06_alex_bad":
  basis: no_guidance
  rationale: The June 8 memo makes no scoring claim about this interview. Observed scores stand.

"2026-06-06_tom_bad":
  basis: no_guidance
  rationale: The June 8 memo makes no scoring claim about this interview. Observed scores stand.

