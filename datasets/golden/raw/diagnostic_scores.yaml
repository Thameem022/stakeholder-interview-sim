# Human grader scores for the 16 pilot interviews, one block per transcript. Each score was
# reviewed by the grader and recorded in that interview's "Interview Diagnostic" .docx report
# under docs/Trial Run/. These are the reference scores for this corpus.
#
# The .docx reports hold page images rather than text, so the numbers were read off the report
# by hand -- source_diagnostic on each block names the report a value came from, for re-checking.
#
# Status vocabulary mirrors backend/app/evaluation/sic_scorer.py:
#   full | partial | not_accessed_insufficient_framing | not_accessed_appropriate_restraint
#
# Tier 3 percentages are credit-weighted, not raw counts (_TIER3_CREDIT_WEIGHT:
# explicit=1.0, indirect=0.7, reflective_silence=0.5), so e.g. 4/4 cues can read 77.5%.
#
# WARNING: image filenames inside these .docx files are NOT document order. The report header
# carrying the overall score is image5.jpeg in several documents. All five images per document
# were read and assembled by content.

