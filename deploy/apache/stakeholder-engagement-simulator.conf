# Apache reverse-proxy for stakeholder-engagement-simulator.wpi.edu
#
# Coexists on the same Ubuntu host as interviewsimulator.wpi.edu (old app on
# :8000). This app listens on 127.0.0.1:8001.
#
# Required modules:
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers rewrite ssl
#
# The live interview streams audio over a WebSocket to this app
# (/api/realtime/stream); the backend relays it to Amazon Bedrock. The browser
# never talks to an AI provider; besides this vhost it loads only the web fonts
# named in the Content-Security-Policy below.
#
# TLS (SR-2026-052 item 2.3, SEC-ENC-001): TLS 1.2 minimum with AEAD ciphers
# only, TLS 1.3 preferred. Check with deploy/check_tls.sh after any change.

<VirtualHost *:80>
    ServerName stakeholder-engagement-simulator.wpi.edu
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^/(.*)$ https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName stakeholder-engagement-simulator.wpi.edu
    ServerAdmin webmaster@wpi.edu

    SSLEngine on
    SSLCertificateFile      /etc/incommon/stakeholder-engagement-simulator.wpi.edu.crt
    SSLCertificateKeyFile   /etc/incommon/stakeholder-engagement-simulator.wpi.edu.key
    SSLCertificateChainFile /etc/incommon/stakeholder-engagement-simulator.wpi.edu.chain.crt

    # --- TLS ------------------------------------------------------------------
    # TLS 1.2 and 1.3 only. A client that offers 1.3 gets 1.3; 1.2 is the floor
    # for older clients. Apache honours these per name-based vhost (2.4.42+
    # with OpenSSL 1.1.1+, which current Ubuntu has), so the old app's vhost on
    # this host is unaffected.
    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    # TLS 1.2: forward-secret AEAD suites only (AES-GCM, ChaCha20-Poly1305) —
    # no CBC, no RSA key exchange, no SHA-1. TLS 1.3 suites are all AEAD; the
    # list below pins them to the standard three.
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLCipherSuite TLSv1.3  TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    # Every suite above is strong; let the client pick the fastest for it.
    SSLHonorCipherOrder     off
    SSLSessionTickets       off
    SSLCompression          off

    # --- Security headers -----------------------------------------------------
    # `always` so they are on error responses and proxied responses too.
    # HSTS: two years. No includeSubDomains/preload: this name has no subdomains
    # of its own, and preload is a decision for the whole domain.
    Header always set Strict-Transport-Security "max-age=63072000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "DENY"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    # The microphone is needed for spoken interviews, on this origin only.
    Header always set Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=()"
    # Same origin for everything (including the interview WebSocket), plus the
    # web fonts. blob:/data: cover the avatar's textures and audio buffers: the
    # 3D loader fetches embedded textures from blob: URLs (hence connect-src).
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: wss://stakeholder-engagement-simulator.wpi.edu; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

    # --- Proxy to the app -------------------------------------------------------
    # REST API + static React app served from FastAPI at 127.0.0.1:8001.
    # `timeout=600` keeps long-running eval requests (IQR+SIC scoring can take
    # 15–30s) from being cut off by the proxy.
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # The interview WebSocket must be matched before the catch-all below.
    # Interviews last up to REALTIME_MAX_SESSION_MINUTES (30), so the tunnel
    # timeout is longer than that.
    ProxyPass        /api/realtime/stream  ws://127.0.0.1:8001/api/realtime/stream  timeout=2100
    ProxyPass        /  http://127.0.0.1:8001/  timeout=600 keepalive=On
    ProxyPassReverse /  http://127.0.0.1:8001/

    ErrorLog  ${APACHE_LOG_DIR}/stakeholder-engagement-simulator_error.log
    CustomLog ${APACHE_LOG_DIR}/stakeholder-engagement-simulator_access.log combined
</VirtualHost>
